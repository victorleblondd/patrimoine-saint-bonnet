<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.url == "/" %}
<title>{{ site.title }}</title>
{%- else %}
<title>{{ page.title }} – {{ site.title }}</title>
{%- endif %}
{%- assign description = page.description | default: site.description %}
<meta name="description" content="{{ description | escape }}">
{%- if site.proposition %}
<meta name="robots" content="noindex, nofollow">
{%- endif %}
{%- if site.url != "" and site.url %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ page.image | default: '/assets/images/village-neige.jpg' | absolute_url }}">
{%- endif %}
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title | escape }}{% endif %}">
<meta property="og:description" content="{{ description | escape }}">
<meta name="theme-color" content="#1F272B">
<link rel="icon" href="data:,">
<link rel="preload" href="{{ '/assets/fonts/spectral-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=1">
<script>document.documentElement.className += ' js';</script>
